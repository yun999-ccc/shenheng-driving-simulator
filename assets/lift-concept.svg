<path d="M649 185V440" class="line" marker-start="url(#a)" marker-end="url(#a)"/><text x="661" y="300" class="small">1.70m</text>
<path d="M492 557H689" class="line"/><text x="510" y="583" class="small">示例：探头中心水下0.80m</text>
<rect x="730" y="110" width="330" height="486" rx="12" fill="#fff" stroke="#d6e1d0"/>
<text x="752" y="146" class="label" font-weight="bold">收纳顺序</text>
<text x="752" y="187" class="label">停止推进 / 结束记录</text><path d="M780 202V226" class="line" marker-end="url(#a)"/>
<text x="752" y="255" class="label">镜头归正，保留中央通道</text><path d="M780 270V294" class="line" marker-end="url(#a)"/>
<text x="752" y="323" class="label">卷扬上收，框底离水</text><path d="M780 338V362" class="line" marker-end="url(#a)"/>
<text x="752" y="391" class="label">进入托座，锁销接合</text><path d="M780 406V430" class="line" marker-end="url(#a)"/>
<text x="752" y="459" class="label">允许返航 / 岸上维护示意</text>
<text x="752" y="505" class="small">下放采用相反顺序：</text><text x="752" y="532" class="small">先退出锁销，再下放；入水后开放观测。</text><text x="752" y="568" class="small">失电演练仅切断卷扬，倾转独立供电。</text>
<text x="40" y="676" class="small">待验证：主绳固定与滑轮倍率、级间同步、松绳 / 卡滞、制动与锁销载荷、移动线缆弯曲寿命及浮力稳性。</text>
</svg>
