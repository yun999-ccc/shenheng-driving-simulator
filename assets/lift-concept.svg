<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#416c56"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#264b3b}.label{font-size:17px}.small{font-size:14px;fill:#657a69}.line{fill:none;stroke:#416c56;stroke-width:2}.rope{fill:none;stroke:#bd922e;stroke-width:3}.ghost{fill:none;stroke:#4e9777;stroke-width:2;stroke-dasharray:6 5}</style></defs>
<rect width="1100" height="720" rx="20" fill="#f3f6ee"/><text x="40" y="52" font-size="27" font-weight="bold">离水回收机构 · 概念剖面与动作关系</text><text x="40" y="82" class="small">侧视示意，局部放大；不是加工图。尺寸来自网页几何，承载、倍率、密封与容差待验证。</text>
<rect x="40" y="110" width="280" height="286" rx="12" fill="#fff" stroke="#d6e1d0"/>
<text x="60" y="143" class="label" font-weight="bold">固定件与移动件</text>
<text x="60" y="180" class="label">① 固定外套筒 + 后置支撑</text><text x="60" y="216" class="label">② 三段方形滑套，键向导向</text><text x="60" y="252" class="label">③ 主绳连接末级横头</text><text x="60" y="288" class="label">④ 制动单元与手摇接口</text><text x="60" y="324" class="label">⑤ 托座承接，锁销再接合</text><text x="60" y="365" class="small">级间等距运动为约束，非传动求解。</text>
<rect x="40" y="465" width="280" height="170" rx="12" fill="#e7efe3"/>
<text x="60" y="499" class="label" font-weight="bold">两种独立承载概念</text><text x="60" y="535" class="label">运行：主绳 / 导向机构</text><text x="60" y="568" class="label">收纳：承托座 / 机械锁销</text><text x="60" y="606" class="small">网页制动保持 ≠ 实物防坠通过。</text>
<path d="M350 440H705" stroke="#80a8a0" stroke-width="2" stroke-dasharray="10 6"/><text x="610" y="432" class="small">静水面 y=0</text>
