<rect x="392" y="542" width="99" height="51" rx="7" fill="none" stroke="#6c8270" stroke-width="4"/>
<rect x="428" y="550" width="26" height="22" rx="4" fill="#315c4c"/><path d="M441 572V579" stroke="#172e22" stroke-width="6"/><path d="M392 593H407M476 593H491" stroke="#315c4c" stroke-width="4"/>
<rect x="392" y="340" width="99" height="51" rx="7" class="ghost"/><text x="348" y="326" class="small">离水收纳位置（虚线）</text>
